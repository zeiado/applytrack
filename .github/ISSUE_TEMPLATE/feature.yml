name: Feature request
description: Propose a new feature or user story
labels: ["type: feature"]
body:
  - type: input
    id: story
    attributes:
      label: User story
      placeholder: "As a job seeker, I want to ... so that ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that must be true for this to be done.
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
