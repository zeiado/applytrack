name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs can read the repo and nothing else unless they ask.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: applytrack
          POSTGRES_PASSWORD: applytrack
          POSTGRES_DB: applytrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applytrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APPLYTRACK_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack
      APPLYTRACK_TEST_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Test (PostgreSQL)
        run: uv run pytest --cov-report=xml

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Audit locked dependencies against known vulnerabilities (PyPI + OSV)
        run: make audit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: applytrack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
