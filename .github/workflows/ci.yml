name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the full CI before publishing

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs can read the repo and nothing else unless they ask.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type check, test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest version we support (requires-python); the Docker image
        # ships whatever the Dockerfile's base image is. Keep that version in this list.
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: applytrack
          POSTGRES_PASSWORD: applytrack
          POSTGRES_DB: applytrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applytrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APPLYTRACK_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack
      APPLYTRACK_TEST_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (Python and workflow files)
        run: make lint
      - name: Type check
        run: uv run mypy
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Test (PostgreSQL)
        run: uv run pytest --cov-report=xml

  web:
    name: Web app (lint, type check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: npm ci
      - name: API client matches the API (run `make openapi` if this fails)
        run: |
          (cd .. && uv run --frozen python scripts/export_openapi.py web/openapi.json)
          npm run gen:api
          git diff --exit-code -- openapi.json src/lib/api/schema.ts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  extension:
    name: Browser extension (type check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check, test and build
        run: npm run check

  e2e:
    name: End-to-end tests (web app + API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: applytrack
          POSTGRES_PASSWORD: applytrack
          POSTGRES_DB: applytrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applytrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APPLYTRACK_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            extension/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install API dependencies
        working-directory: .
        run: uv sync --frozen
      - name: Install web dependencies and the browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the web app
        run: npm run build
        env:
          API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_FEEDBACK_URL: https://tally.so/r/e2e-feedback
      - name: Build the browser extension for the local web app
        working-directory: extension
        run: |
          npm ci
          npm run build
        env:
          SEKKA_APP_URL: http://localhost:3000
      - name: Run end-to-end tests (starts the API and the web app)
        run: npm run e2e
        env:
          NEXT_PUBLIC_FEEDBACK_URL: https://tally.so/r/e2e-feedback
      - name: Keep the report and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Audit locked dependencies against known vulnerabilities (PyPI + OSV)
        run: make audit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: applytrack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
