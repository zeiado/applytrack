name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs can read the repo and nothing else unless they ask.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: applytrack
          POSTGRES_PASSWORD: applytrack
          POSTGRES_DB: applytrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applytrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APPLYTRACK_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack
      APPLYTRACK_TEST_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Test (PostgreSQL)
        run: uv run pytest --cov-report=xml

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Audit locked dependencies against known vulnerabilities (PyPI + OSV)
        run: make audit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: applytrack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
