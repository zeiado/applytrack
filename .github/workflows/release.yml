name: Release

# Push a tag like v1.2.3 to release. See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # never cancel a release half-way

jobs:
  verify:
    name: Tag matches pyproject version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Compare the tag with pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$project" ]; then
            echo "::error::Tag v$tag doesn't match pyproject.toml version $project"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG has a section for this version
        run: python3 scripts/changelog.py "${{ steps.version.outputs.version }}" > /dev/null

  ci:
    name: Full CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish-image:
    name: Publish Docker image to GHCR
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max # record how and from what the image was built
          sbom: true # attach a list of everything inside the image
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes from CHANGELOG.md
        run: |
          version="${{ needs.verify.outputs.version }}"
          python3 scripts/changelog.py "$version" > notes.md
          cat >> notes.md <<NOTES

          ### Docker image

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:$version
          \`\`\`
          NOTES
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  deploy-production:
    name: Deploy to production (Render)
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the deploy hook with the tagged commit
        id: trigger
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_PRODUCTION_DEPLOY_HOOK isn't set; skipping the deploy (docs/deployment.md)"
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --silent --show-error --request POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}" > /dev/null
          echo "triggered=true" >> "$GITHUB_OUTPUT"
      - name: Wait until production reports the new version
        if: steps.trigger.outputs.triggered == 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL isn't set; can't confirm the deploy"
            exit 0
          fi
          for _ in $(seq 1 60); do
            live=$(curl --silent --max-time 10 "$PRODUCTION_URL/health" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$live" = "$VERSION" ]; then
              echo "Production is running $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production didn't report version $VERSION within 10 minutes"
          exit 1
