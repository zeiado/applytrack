services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: applytrack
      POSTGRES_DB: applytrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applytrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APPLYTRACK_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@db:5432/applytrack
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  # Runs queued jobs, such as emails (docs/adr/0007-database-job-queue-and-email.md).
  # With the default console backend, emails appear in this service's log.
  worker:
    build: .
    command: ["python", "-m", "applytrack.worker"]
    environment:
      APPLYTRACK_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@db:5432/applytrack
    env_file:
      - path: .env
        required: false
    healthcheck:
      disable: true # the image's check calls the API's /health; the worker serves no HTTP
    depends_on:
      api:
        condition: service_healthy # the API applies migrations when it starts

volumes:
  pgdata:
