services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: applytrack
      POSTGRES_DB: applytrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applytrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APPLYTRACK_DATABASE_URL: postgresql+psycopg://applytrack:applytrack@db:5432/applytrack
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
