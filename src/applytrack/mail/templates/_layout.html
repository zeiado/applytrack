{# Shared HTML layout. Tables and inline styles because many email apps ignore <style>. #}
{% set align = "right" if dir == "rtl" else "left" %}
<!doctype html>
<html lang="{{ locale }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ app_name }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
<tr>
<td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:8px;">
<tr>
<td dir="{{ dir }}" style="padding:32px;font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.7;color:#1f2933;text-align:{{ align }};">
<p style="margin:0 0 24px;font-size:20px;font-weight:bold;color:#111827;">{{ app_name }}</p>
{% block content %}{% endblock %}
</td>
</tr>
</table>
<p dir="{{ dir }}" style="margin:16px 0 0;font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b7280;">
{% block footer %}{% endblock %}
</p>
</td>
</tr>
</table>
</body>
</html>
