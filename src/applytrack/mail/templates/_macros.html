{# A link styled as a button. Also print the plain link: some email apps hide buttons. #}
{% macro button(url, label) %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
<tr>
<td style="border-radius:6px;background-color:#2563eb;">
<a href="{{ url }}" style="display:inline-block;padding:12px 24px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ label }}</a>
</td>
</tr>
</table>
{% endmacro %}
