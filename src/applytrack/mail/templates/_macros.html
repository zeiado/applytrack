{# A link styled as a button. Also print the plain link: some email apps hide buttons. #}
{% macro button(url, label) %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
<tr>
<td style="border-radius:12px;background-color:#00695A;">
<a href="{{ url }}" style="display:inline-block;padding:14px 24px;border-radius:12px;font-weight:bold;color:#FFFFFF;text-decoration:none;">{{ label }}</a>
</td>
</tr>
</table>
{% endmacro %}
