<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>إنشاء حساب في سكة</title>
<!-- Reference mockup for Sekka. Static HTML: copy structure, spacing and tokens, not the markup verbatim. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#00695A}a:hover{color:#004D42}
input::placeholder{color:#7A817E}
</style>
</head>
<body>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 28px; background: #FAF8F4; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #1B1F1E; display: flex; flex-direction: column; gap: 22px">

  <div style="display: flex; justify-content: center">
    <img src="assets/sekka-horizontal-arabic-color.svg" alt="سكة" style="width: 132px; height: auto; display: block">
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <svg aria-hidden="true" viewBox="0 0 342 24" width="342" height="24"><path d="M26 12 H330" stroke="#C9D6D2" stroke-width="3" stroke-linecap="round"/><path d="M26 12 H330" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="6 6"/><circle cx="330" cy="12" r="6" fill="#00695A"/><circle cx="12" cy="12" r="7" fill="#F2A541"/></svg>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.3; font-weight: 600">أنشئ حسابك</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5C6461">كل تقديماتك في مكان واحد، وسكة تفكّرك إمتى تتابع.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px; flex: none">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-name" style="font-size: 14px; font-weight: 500">اسمك</label>
      <input id="su-name" type="text" placeholder="الاسم بالكامل" style="height: 50px; box-sizing: border-box; border: 1px solid #E3DED5; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 16px; color: #1B1F1E">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-email" style="font-size: 14px; font-weight: 500">الإيميل</label>
      <input id="su-email" type="email" dir="ltr" placeholder="name@example.com" style="height: 50px; box-sizing: border-box; border: 1px solid #E3DED5; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 16px; color: #1B1F1E; text-align: right">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-pass" style="font-size: 14px; font-weight: 500">كلمة السر</label>
      <input id="su-pass" type="password" placeholder="٨ حروف على الأقل" style="height: 50px; box-sizing: border-box; border: 2px solid #00695A; border-radius: 12px; background: #FFFFFF; padding: 0 13px; font: inherit; font-size: 16px; color: #1B1F1E">
    </div>
    <button type="button" style="height: 52px; border: none; border-radius: 14px; background: #00695A; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; margin-top: 6px">إنشاء حساب</button>
  </form>

  <div style="display: flex; align-items: center; gap: 12px; color: #5C6461; font-size: 14px">
    <span style="flex: 1; height: 1px; background: #E3DED5"></span><span>أو</span><span style="flex: 1; height: 1px; background: #E3DED5"></span>
  </div>

  <button type="button" style="flex: none; height: 52px; border: 1px solid #E3DED5; border-radius: 14px; background: #FFFFFF; color: #1B1F1E; font: inherit; font-size: 16px; font-weight: 500">المتابعة بحساب Google</button>

  <div style="margin-top: auto; flex: none; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center">
    <p style="margin: 0; font-size: 15px">عندك حساب؟ <a href="#" style="font-weight: 600">سجّل دخول</a></p>
    <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5C6461">بإنشاء حساب، أنت موافق على الشروط وسياسة الخصوصية.</p>
  </div>
</div>
</body>
</html>
