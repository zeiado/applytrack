<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>سكة: الصفحة الرئيسية</title>
<!-- Reference mockup for Sekka. Static HTML: copy structure, spacing and tokens, not the markup verbatim. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAF8F4}
a{color:#1B1F1E}a:hover{color:#00695A}
</style>
</head>
<body>
<div dir="rtl" style="min-height: 820px; background: #FAF8F4; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #1B1F1E">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 32px; box-sizing: border-box">

    <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 28px 0">
      <img src="assets/sekka-horizontal-arabic-color.svg" alt="سكة" style="width: 104px; height: auto; display: block">
      <nav style="display: flex; align-items: center; gap: 28px; font-size: 15px">
        <a href="#" lang="en" style="text-decoration: none">English</a>
        <a href="#" style="text-decoration: none; font-weight: 500">تسجيل الدخول</a>
      </nav>
    </header>

    <section style="display: flex; flex-wrap: wrap; align-items: center; gap: 48px; padding: 72px 0 96px">
      <div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
        <h1 style="margin: 0; font-size: clamp(3rem, 6.4vw, 5.25rem); line-height: 1.15; font-weight: 700; text-wrap: balance">خليك على السكة</h1>
        <p style="margin: 0; font-size: 1.3rem; line-height: 1.8; color: #5C6461; max-width: 31rem; text-wrap: pretty">سكة بتجمع كل تقديماتك على الشغل في مكان واحد، وبتفكّرك تتابع، لحد ما حد يقولك أيوه.</p>
        <div style="display: flex">
          <a href="#" style="display: inline-flex; align-items: center; height: 56px; padding: 0 30px; border-radius: 16px; background: #00695A; color: #FFFFFF; font-size: 18px; font-weight: 600; text-decoration: none">ابدأ مجانًا</a>
        </div>
      </div>

      <div style="flex: 1 1 440px; min-width: 0">
        <svg role="img" aria-label="طريق بيعدّي على مراحل البحث عن شغل لحد ما توصل لأيوه" viewBox="0 0 560 470" style="width: 100%; height: auto; display: block; font-family: inherit">
          <path d="M520 410 H160 A65 65 0 0 1 160 280 H400 A65 65 0 0 0 400 150 H140" fill="none" stroke="#00695A" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M520 410 H160 A65 65 0 0 1 160 280 H400 A65 65 0 0 0 400 150 H140" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 10" opacity="0.8"/>
          <circle cx="80" cy="150" r="22" fill="#F2A541"/>
          <g fill="#FFFFFF" stroke="#00695A" stroke-width="3">
            <circle cx="470" cy="410" r="8"/><circle cx="270" cy="410" r="8"/><circle cx="230" cy="280" r="8"/><circle cx="360" cy="280" r="8"/><circle cx="260" cy="150" r="8"/>
          </g>
          <g font-size="16" fill="#5C6461" text-anchor="middle">
            <text x="470" y="453">عايز أقدّم</text><text x="270" y="453">قدّمت</text>
            <text x="230" y="323">مراجعة أولى</text><text x="360" y="323">مقابلات</text>
            <text x="260" y="120">عرض</text>
          </g>
          <text x="80" y="110" font-size="19" font-weight="600" fill="#1B1F1E" text-anchor="middle">أيوه!</text>
        </svg>
      </div>
    </section>
  </div>
</div>
</body>
</html>
